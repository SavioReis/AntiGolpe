<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta — AntiGolpe</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">
        <span class="brand__mark" aria-hidden="true">AG</span>
        <span>AntiGolpe</span>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="nav-principal">☰ Menu</button>
      <nav class="nav-principal" id="nav-principal" aria-label="Navegação principal" data-open="false">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="simulador.html">Simulador</a></li>
          <li><a href="biblioteca.html">Biblioteca</a></li>
          <li><a href="verificador.html">Verificar link</a></li>
          <li><a href="painel.html">Painel</a></li>
        </ul>
      </nav>
      <div class="acoes-header">
        <a class="btn btn--secundario" href="login.html">Entrar</a>
        <a class="btn btn--primario" href="cadastro.html">Criar conta</a>
      </div>
    </div>
  </header>

  <main>
    <div class="container container--estreito">

      <h1>Criar conta</h1>
      <p class="text-muted">Leva menos de 1 minuto. Sua senha é armazenada com hash seguro.</p>

      <form class="form mt-4" id="form-cadastro" method="post" action="#" novalidate>

        <fieldset>
          <legend>Dados de acesso</legend>

          <div class="form mt-4">
            <div class="campo">
              <label for="nome">Nome completo</label>
              <input type="text" id="nome" name="nome" required autocomplete="name" minlength="3" maxlength="120">
              <p id="nome-erro" class="campo__erro" role="alert" hidden></p>
            </div>

            <div class="campo">
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" required autocomplete="email" placeholder="voce@exemplo.com">
              <p id="email-erro" class="campo__erro" role="alert" hidden></p>
            </div>

            <div class="campo">
              <label for="senha">Senha</label>
              <input type="password" id="senha" name="senha" required autocomplete="new-password" minlength="8">
              <p id="forca-senha" class="campo__ajuda"></p>
              <p id="senha-erro" class="campo__erro" role="alert" hidden></p>
            </div>

            <div class="campo">
              <label for="senha2">Confirmar senha</label>
              <input type="password" id="senha2" name="senha2" required autocomplete="new-password" minlength="8">
              <p id="senha2-erro" class="campo__erro" role="alert" hidden></p>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Preferências</legend>
          <div class="form mt-4">
            <div class="campo--checkbox">
              <input type="checkbox" id="alertas" name="alertas" value="1" checked>
              <label for="alertas">Receber alertas de novos golpes por e-mail</label>
            </div>

            <div class="campo">
              <div class="campo--checkbox">
                <input type="checkbox" id="termos" name="termos" value="1" required>
                <label for="termos">
                  Li e aceito os <a href="#">termos de uso</a> e a
                  <a href="#">política de privacidade</a>.
                </label>
              </div>
              <p id="termos-erro" class="campo__erro" role="alert" hidden></p>
            </div>
          </div>
        </fieldset>

        <button type="submit" class="btn btn--primario btn--bloco btn--grande">Criar minha conta</button>

        <div id="cadastro-feedback" hidden></div>
      </form>

      <p class="text-center mt-4">
        Já tem conta? <a href="login.html">Entrar</a>
      </p>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span>© 2026 AntiGolpe — Projeto acadêmico</span>
        <span>HTML · CSS · JavaScript</span>
      </div>
    </div>
  </footer>

  <script src="js/utils.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/auth.js" defer></script>
</body>
</html>
